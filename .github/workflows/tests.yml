name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [jax, tensorflow, torch]
    env:
      KERAS_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ "${{ matrix.backend }}" = "jax" ]; then pip install jax; fi
          if [ "${{ matrix.backend }}" = "tensorflow" ]; then pip install tensorflow-cpu; fi
          if [ "${{ matrix.backend }}" = "torch" ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
      - name: Run tests
        run: pytest -q
