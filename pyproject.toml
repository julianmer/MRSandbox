[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsandbox"
version = "0.0.1"
description = "A simulation sandbox for magnetic resonance spectroscopy."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julian P. Merkofer", email = "j.p.merkofer@tue.nl" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "nifti-mrs",
    "keras>=3.15",
    "nifti-mrs-plus>=0.2.0",
]

[project.optional-dependencies]
jax = ["jax"]
torch = ["torch"]
tensorflow = ["tensorflow"]
dev = ["pytest", "pypulseq"]

[tool.setuptools.packages.find]
include = ["mrsandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that render full scans; deselect with -m 'not slow'",
]
