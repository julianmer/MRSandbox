[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsandbox"
dynamic = ["version"]
description = "A simulation sandbox for magnetic resonance spectroscopy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Julian P. Merkofer", email = "j.p.merkofer@tue.nl" }]
keywords = ["MRS", "magnetic resonance spectroscopy", "simulation", "density matrix", "NIfTI-MRS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "nifti-mrs",
    "keras>=3.15",
    "nifti-mrs-plus>=0.2.0",
    # the transient instabilities, the spurious echoes and the eddy phase of every acquisition
    "augmentrum>=0.0.3",
    # the backend the physics is measured on, so a plain install runs; flatbuffers serializes
    # the engine's graph exports (jax.export)
    "jax",
    "flatbuffers",
]

[project.urls]
Homepage = "https://github.com/julianmer/MRSandbox"
Source = "https://github.com/julianmer/MRSandbox"
Issues = "https://github.com/julianmer/MRSandbox/issues"

[project.optional-dependencies]
jax = ["jax", "flatbuffers"]
torch = ["torch"]
tensorflow = ["tensorflow"]
# the virtual scanner console (mrsandbox.console): uvx --from "mrsandbox[console]" mrsandbox-console;
# pandas holds the measured database as one table (scan.cohort.table)
console = ["nicegui", "pywebview", "pillow", "dcm2niix", "pandas", "mrsandbox[jax]"]
dev = ["pytest", "pypulseq", "ruff", "mrsandbox[jax]"]

[project.scripts]
mrsandbox-console = "mrsandbox.console.app:main"

# the console's logo stays in assets/, its one home; a built package installs that one file beside itself
# (<environment>/share/mrsandbox), where mrsandbox.console finds it when the repository is not around
[tool.setuptools.data-files]
"share/mrsandbox" = ["assets/logo/logo.png"]

[tool.setuptools.packages.find]
include = ["mrsandbox*"]

[tool.setuptools.dynamic]
version = { attr = "mrsandbox.__version__" }

[tool.ruff]
line-length = 100
# third-party submodules are not ours to lint
extend-exclude = ["externals"]

[tool.ruff.lint]
# pyflakes plus the pycodestyle errors; the house style keeps dict(...) calls,
# unsorted grouped imports, and the banner comment layout out of lint's reach,
# and allows short lambdas in helpers (E731) and l as the partition index (E741)
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# package inits are banner plus re-export imports only
"**/__init__.py" = ["F401"]
# pypulseq is gated by importorskip before the module imports
"tests/io/test_pulseq.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: integration tests that render full scans; deselect with -m 'not render'",
    "slow: the gates over a minute each on a laptop; deselect with -m 'not slow' for a quick run",
]
